name: Backend CI

on:
  pull_request:

jobs:
  backend-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --requirement backend/requirements-dev.txt

      - name: Run Ruff
        run: python -m ruff check backend/app backend/scripts backend/tests evaluation

      - name: Run mypy
        run: python -m mypy

      - name: Run unittest
        run: python -m unittest discover -s backend/tests
